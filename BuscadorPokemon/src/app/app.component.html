<main class="page">
  <section class="card">
    <header class="header">
      <h1 class="title">Buscador de Pokémon</h1>
      <p class="subtitle">Escribe el nombre de un Pokémon y descubre su imagen.</p>
    </header>

    <form class="search" (ngSubmit)="buscar()">
      <input
        class="input"
        type="text"
        name="searchTerm"
        [(ngModel)]="searchTerm"
        placeholder="Ej: ditto, pikachu, charizard"
        autocomplete="off"
        aria-label="Nombre del Pokémon"
      />
      <button class="button" type="submit" [disabled]="loading">
        {{ loading ? 'Buscando...' : 'Buscar' }}
      </button>
    </form>

    <p class="error" *ngIf="error" role="alert">{{ error }}</p>

    <div class="result" *ngIf="pokemon">
      <div class="image-wrapper">
        <img
          class="image"
          [src]="pokemon.image"
          [alt]="'Imagen de ' + pokemon.name"
        />
      </div>
      <p class="name">{{ pokemon.name }}</p>
    </div>
  </section>
</main>
